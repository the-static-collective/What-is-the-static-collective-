name: Guard public Git atlas contracts

on:
  pull_request:
    paths:
      - "scripts/refresh_git_atlas.py"
      - "scripts/visibility_aperture.py"
      - "tests/test_refresh_git_atlas.py"
      - "tests/test_visibility_aperture.py"
      - "atlas/**"
      - ".github/workflows/atlas-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile atlas executables
        run: python3 -m py_compile scripts/refresh_git_atlas.py scripts/visibility_aperture.py
      - name: Run atlas boundary tests
        run: |
          python3 -m unittest tests/test_refresh_git_atlas.py
          python3 -m unittest tests/test_visibility_aperture.py
      - name: Validate admitted relation endpoints
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path(".")
          module = root / "scripts" / "refresh_git_atlas.py"
          spec = importlib.util.spec_from_file_location("refresh_git_atlas", module)
          atlas = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(atlas)

          snapshot = json.loads((root / "atlas" / "generated" / "public-index.json").read_text())
          relations = json.loads((root / "atlas" / "relations.json").read_text())
          atlas.validate_relations(relations, snapshot)
          print("Curated relation endpoints and statuses are valid")
          PY
