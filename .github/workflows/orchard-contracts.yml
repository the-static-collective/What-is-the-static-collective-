name: Orchard contracts

on:
  pull_request:
    paths:
      - "orchard/**"
      - ".github/workflows/orchard-contracts.yml"
  push:
    branches:
      - "feature/relay-garden-001"
    paths:
      - "orchard/**"
      - ".github/workflows/orchard-contracts.yml"

permissions:
  contents: read

jobs:
  orchard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test ORCHARD
        working-directory: orchard
        run: |
          npm test
          npm run check
